name: CI

# Billing is per job, rounded up to the minute, and the suite takes ~5s. So the
# cost of CI is the number of jobs, not their duration: five jobs doing ninety
# seconds of work cost five minutes. Hence one job, one Python, two installs.
# Do not split a step out into a job of its own to parallelise it — that trades
# a few seconds of wall clock for a whole billed minute.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # The single required check. Fixed name, no matrix, so the branch ruleset can
    # name it directly and never needs updating.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          # The floor, and the only version we test. If it works on the oldest
          # supported interpreter it almost certainly works on the newer ones;
          # the common real breakage is reaching for a 3.12+ stdlib feature,
          # which is exactly what this catches. Note that this leaves the 3.12
          # and 3.13 classifiers in pyproject.toml as untested claims — see the
          # early-development section of RELEASING.md.
          python-version: "3.11"
          enable-cache: true

      # A denylist, unlike the `paths:` filter bench.yml refuses: an allowlist
      # drifts and a job that stopped running looks like one that passed, so
      # this asks whether *every* changed path is inert and a directory nobody
      # listed runs everything. Not `paths-ignore:` — `ci` is required, and a
      # workflow that never starts never reports the status the PR waits for.
      #
      # Only an answer sets the output. A diff that did not read, or read as
      # empty, is not evidence of inertness — the default is to run everything,
      # because the alternative is skipping a gate on a failed API call.
      #
      # An entry earns its place by being unreachable from all three steps:
      # prose and the licence are read by nothing, `mkdocs.yml` only by the
      # strict build above, and the release manifest by release-please — the
      # version the build stamps comes from the git tag, not from that file.
      - name: Is every changed file inert?
        id: scope
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! changed=$(gh pr diff ${{ github.event.number }} --name-only); then
            echo 'The diff did not read; running everything.'
            exit 0
          fi
          live=$(printf '%s\n' "$changed" | grep -Ev \
            '(^|/)[^/]+\.md$|^LICENSE$|^mkdocs\.yml$|^\.release-please-manifest\.json$' || true)
          if [ -n "$changed" ] && [ -z "$live" ]; then
            echo 'inert=true' >> "$GITHUB_OUTPUT"
            echo 'Prose only — the TeX render and the bare install are skipped.'
          else
            printf 'Running everything. Live files:\n%s\n' "$live"
          fi

      # Current dependencies, dev group *and every extra the package ships code
      # for*: `pyrefly` treats `missing-import` as an error, so an optional
      # dependency absent here is a type-check failure on code that is in the
      # wheel. Both engines come in with the project itself — duckdb and pyarrow
      # are runtime dependencies — so `dev` is the whole list.
      - run: uv sync --group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      # Only meaningful here, not below: missing-import is an error, and the
      # linopy lane imports linopy/xarray, which a bare install deliberately lacks.
      - run: uv run --no-sync pyrefly check --output-format=github
      # The default engine, unflagged — so the pass nobody has to remember to
      # run is the one measuring what a caller gets.
      - run: uv run --no-sync pytest -q

      # The whole suite again, on the other engine. Not a subset and not a
      # separate parity file: the claim `LPSPEC_ENGINE=polars` makes is that a
      # caller can choose it and nothing else changes, and only running every
      # test that reaches `lps.build` checks that. It costs ~25s.
      #
      # `test_engine_parity.py` asserts the switch actually took effect, so
      # this cannot silently degrade into a second run of the default engine.
      - run: uv run --no-sync pytest -q --engine polars

      # The site, built strictly: `strict: true` in mkdocs.yml turns every
      # warning into a failure, so this gate catches a dead cross-link, a model
      # page added without a nav entry, and an anchor that stopped resolving.
      # A step, not a job of its own — see the note at the top of this file;
      # the docs group is small and adds a few seconds to a job we already pay
      # a whole minute for. It comes after the suite and before the bare
      # install, which wipes .venv.
      - run: uv sync --group docs
      - run: uv run --no-sync mkdocs build --strict

      # Typst is compiled by the suite above — it ships as a pip wheel, so
      # `pytest` already proves that half. LaTeX needs a toolchain, so its
      # compile lives here. The suite's structural checks (brace balance,
      # environment nesting, \left/\right pairing) are what a *generator* gets
      # wrong and need nothing installed, but they are not a compile: a
      # malformed \mathcal or a package we forgot to \usepackage passes every
      # one of them.
      #
      # Every model, examples *and* ports — `examples/*.yaml` is not recursive
      # and would cover five of sixteen, which is the bug #282 fixed in two
      # test globs. A port is exactly where an unusual construct shows up.
      #
      # The package list is deliberately minimal, and each entry earns its place:
      #   texlive-latex-base        geometry.sty, amsmath.sty (and pulls in
      #                             texlive-base, which carries amssymb.sty)
      #   texlive-fonts-recommended the msam/msbm fonts amssymb *draws* with —
      #                             \mathbb and \ominus are unset without them
      # If the preamble ever grows a \usepackage, this list grows with it, and
      # that is the point: it keeps the preamble installable from a small TeX.
      - name: Install a minimal TeX
        if: steps.scope.outputs.inert != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-fonts-recommended
      - name: Every model renders to LaTeX that compiles
        # (the Typst half of this claim is `test_typst_output_compiles`)
        if: steps.scope.outputs.inert != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/tex"
          for model in examples/*.yaml examples/ports/*.yaml; do
            name=$(basename "$model" .yaml)
            symbols="examples/symbols/$name.yaml"
            args=(latex "$model" --standalone -o "$RUNNER_TEMP/tex/$name.tex")
            [ -f "$symbols" ] && args+=(--symbols "$symbols")
            uv run --no-sync python -m lpspec "${args[@]}"
            pdflatex -halt-on-error -interaction=nonstopmode \
              -output-directory "$RUNNER_TEMP/tex" "$RUNNER_TEMP/tex/$name.tex"
          done

      # Re-install the same checkout into the shipped shape, at the declared
      # floors. Three claims in one install:
      #   1. the relational product runs with no linopy, xarray or pandas on
      #      disk. pyarrow *is* there — the default engine hands frames over
      #      through Arrow and depends on it — and pandas is what that does not
      #      imply. This is the only honest place to check that half: pyarrow
      #      imports pandas whenever pandas is installed, and polars imports it
      #      on the way up, so hiding it in-process does not work. Here there
      #      simply is no pandas;
      #   2. the runtime dependency set is **complete**, which was false once: a
      #      declaration carrying `duckdb` and not `pyarrow` installs cleanly and
      #      then fails on the first build. No test in the suite can catch that,
      #      because the dev environment has pyarrow via the `[linopy]` extra —
      #      only an install without it can;
      #   3. the lower bounds in pyproject.toml are real. Without this they are
      #      decoration, and decoration is how they go wrong: `>=1.0` on duckdb
      #      once sat five minor versions below the first release carrying the
      #      method the sink called, and nothing noticed until this job existed.
      #
      # `uv venv` + `uv pip install`, deliberately, not `uv sync`. uv locks
      # *universally* — across every declared extra, whether or not it is being
      # installed — so `uv sync --no-default-groups` still resolves under the
      # `[linopy]` extra's constraints. linopy 0.9.0 requires `polars>=1.31.1`,
      # which silently dragged the bare install to polars 1.32 and left our own
      # `polars>=1.30` untested: claim 2 above, defeated by the thing it exists
      # to catch. `uv pip install` resolves the requested set and nothing else.
      # Verified green at polars 1.30.0 / numpy 1.26.0 / highspy 1.10.0 /
      # pydantic 2.0 / pyparsing 3.1.0 / pyyaml 6.0.
      #
      # pytest goes in as a second, unconstrained call: under `lowest-direct`
      # an unpinned direct requirement resolves to pytest 2.0.0, which is a
      # 2011 sdist that tries to build itself over plain HTTP.
      #
      # The floors are a 3.11 claim only, which is the interpreter this job
      # pins: pyyaml 6.0 and numpy 1.26.0 predate 3.13 and have no wheel for
      # it, so `lowest-direct` there tries a source build and fails. Raise a
      # floor when the code relies on that version's behaviour, not to chase
      # a newer interpreter — see the early-development note in RELEASING.md.
      # The suite runs twice here, once per engine, and both are cheap once the
      # install is paid for. Running only the default would leave the polars
      # engine unexercised at the floors, and its floor — polars itself — is the
      # one the linopy extra was silently dragging upward.
      - name: bare install, at the dependency floors
        if: steps.scope.outputs.inert != 'true'
        run: |
          rm -rf .venv
          uv venv
          uv pip install --resolution lowest-direct .
          uv pip install pytest
          uv run --no-sync python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('linopy') is not None)"
          uv run --no-sync python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('pandas') is not None)"
          uv run --no-sync pytest -q
          uv run --no-sync pytest -q --engine polars

      # A solve on the default engine, in that same pandas-free environment,
      # asserting pandas stayed unimported rather than merely uninstalled. The
      # step above proves it is not on disk; this proves the engine does not go
      # looking, which is the claim that would survive somebody installing it
      # for an unrelated reason.
      - name: the default engine reaches for no pandas
        run: |
          uv run --no-sync python -c "
          import polars as pl, lpspec as lps
          src = {'p_max': pl.DataFrame({'generator': ['wind'], 'value': [10.0]}),
                 'cost': pl.DataFrame({'generator': ['wind'], 'value': [1.0]}),
                 'load': pl.DataFrame({'snapshot': [0], 'value': [5.0]})}
          sol = lps.solve('examples/dispatch.yaml', src)
          assert sol.objective == 5.0, sol.objective
          assert isinstance(sol.primal('p'), pl.DataFrame)
          import sys; assert 'pandas' not in sys.modules
          print('default engine OK, pandas-free')
          "
